      - generic [ref=e85]: ★ 298,861
    - generic [ref=e86]: ">让 AI 先问清楚、再写测试的编程技能包。出自知名 TypeScript 教育者 Matt Pocock 的个人 .agents 目录，\"Skills for Real Engineers\"。"
    - generic [ref=e87]: ">为什么火：它约束 AI 按资深工程师的方式干活——先澄清需求、先写测试再实现，把工程纪律注入编码 Agent。"
