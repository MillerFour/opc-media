      - text: ">01REA"
      - generic [ref=e77]: TypeScript
      - generic [ref=e78]: ★ 349,793
    - generic [ref=e79]: ">让 AI 逆向任何 App，一直拆到二进制。通过 Agent 观察应用行为、层层下钻到原生二进制，把闭源应用\"拆开看懂\"。"
    - generic [ref=e80]: ">为什么火：把逆向工程这件高度专业化的事交给 AI——兼容性分析、安全审计、协议破解类工作的门槛被大幅拉低。"
