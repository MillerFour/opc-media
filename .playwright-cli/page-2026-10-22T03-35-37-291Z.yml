    - generic [ref=e4]: ">开源周报 · OPEN SOURCE WEEKLY"
    - generic [ref=e5]: ">GitHub 涨星 TOP 10：本周最值得安装的 10 个 AI 开源项目"
    - generic [ref=e6]: ">来源：B 站视频 BV1UAn36aEX3（2026-10-18 发布）· 每个项目一分钟讲清楚：它是干什么的、为什么火、装上之后你的 AI 能多做什么。"
  - generic [ref=e7]: ">一、核心要点"
  - generic [ref=e8]:
    - text: ">"
    - generic [ref=e9]: ">01 · AI 正在从\"写代码\"扩展到\"懂系统\""
    - generic [ref=e10]: ">REA 让 Agent 逆向任何 App 一直到二进制层，OpenSRE 让 AI 排查线上故障——AI 的能力边界正从生成代码，推进到理解、分析和运维整个软件系统。"
  - generic [ref=e11]:
    - text: ">"
    - generic [ref=e12]: ">02 · 工程纪律类工具集体爆发"
    - generic [ref=e13]: ">skills（先问清楚、再写测试）和 diagram-design（专业图解）本质上是把\"资深工程师的工作方法\"打包成 AI 可执行的技能包，弥补 AI 编码助手在流程和表达上的短板。"
  - generic [ref=e14]:
    - text: ">"
    - generic [ref=e15]: ">03 · 记忆与上下文成为新基建"
    - generic [ref=e16]: ">claude-mem 主打跨对话长期记忆——Agent 的\"记住你\"能力正在成为独立赛道，解决每次对话从零开始的痛点。"
  - generic [ref=e17]:
    - text: ">"
    - generic [ref=e18]: ">04 · 硬件门槛与内容生产被大幅拉低"
    - generic [ref=e19]: ">AirLLM 让 4GB 显卡跑 70B 大模型，text-to-cad 一句话生成可加工 3D 零件，OpenMontage 把 AI 助手变成视频工作室——本地化推理、物理制造、视频创作都在被 AI 重做一遍。"
