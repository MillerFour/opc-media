      - text: 攻击量指数级攀升，多国机构发布紧急预警，各国网站进入"关站—打补丁—恢复"的抢修周期。
  - generic [ref=e62]: 值得注意的两个细节：其一，71 天在大型开源项目的协调披露里并不算慢——要给 4 个在维护分支 + 7.4/8.0/8.1 三个停服版本做源码级回移植，还要协调全球发行版厂商预备补丁；其二，这次真正失控的是泄露——原计划 10 月 22 日披露，结果细节提前流出，官方被迫抢跑一天发版，出现了"漏洞细节满天飞、补丁还没发布"的真空窗口期。
  - generic [ref=e63]: 四、给开发者的一些冷思考
  - generic [ref=e64]:
    - generic [ref=e65]: 「我的代码没问题」不再是护身符
    - generic [ref=e66]: 过去十年的 Web 安全假设是：应用和插件打好补丁，就基本安全。PHP2Shell 直接击穿了这个假设——信任边界在运行时，在你监控不到的那一层。语言/运行时的供应链安全，值得被写进每家公司的安全清单。
  - generic [ref=e67]:
    - generic [ref=e68]: AI 把攻防都按了快进键
    - generic [ref=e69]: 这次漏洞由 AI 辅助研究被发现（Calif 用 GPT-5.6 Sol、Wiz 用 AI Agent + Gemini 4 Argon），也在泄露后加速了武器化。Wiz 的判断很直白：问题在代码里潜伏了十多年，过去不是不危险，而是人工把它变成可用攻击的成本太高。AI 把这个门槛砸掉了——"存在漏洞"到"漏洞可被利用"的时间差，正在归零。
  - generic [ref=e70]:
    - generic [ref=e71]: 停服版本是最大的雷区
    - generic [ref=e72]: 暴露面里最大的一块是 5.4～8.1 这些停服版本。官方这次罕见地为 7.4/8.0/8.1 提供了最小化源码回移植，但这只是应急——还在跑停服版本的系统，欠的不是一次升级，是一份技术债清偿计划。
  - generic [ref=e73]: 五、现在该做什么？
  - generic [ref=e74]: 第一优先级：升级 —— 8.5.12 / 8.4.27 / 8.3.36 / 8.2.35 任一对应分支的安全版本，这是唯一完整的解决方案； 暂时无法升级 —— 按官方公告做临时缓解：memory_limit=-1（用 php_admin_value 固定）、post_max_size=8M（无上传需求时）、关闭 session.upload_progress、重启全部 Worker。注意：缓解措施只是收窄攻击路径，不等于安全； 回溯排查 —— 由于首次在野利用（10 月 17 日）早于官方发布，日志排查窗口要往前翻，重点看异常 POST、Worker 崩溃重启、来历不明的进程与外联。
