bible:
  people:
    卡尔: 父，1847–1913，钢铁巨头，要求儿子接班
    波尔蒂: 母，银行家之女，音乐轴心
    汉斯: 长子，音乐神童，1902 出逃后失踪（不写"确认自杀"）
    鲁迪: 1904 柏林自尽，父亲禁提其名
    库尔特: 1918 前线自尽
    保罗: 唯一被允许学音乐的儿子，失右臂后左手登台
    玛格丽特: 姐姐，引叔本华，委托造屋
  terms:
    语言游戏: 后期概念，卷一~卷四不出现
    不可说: 1918 年后才有，少年段落不引用
  canon:
    - 凡不可说的，必须保持沉默（通行中译）
    - 天才之为责任（蒙克传记书名）
  banned:
